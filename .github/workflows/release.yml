name: Release Build and Publish

on:
  push:
    tags:
      - 'v*.*.*'
      - 'beta-*'

env:
  DOTNET_VERSION: '8.0.x'
  PYTHON_VERSION: '3.10'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Job 1: Build .NET Application and Create Release
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Extract version info
      id: version
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag -replace '^v', ''
        $isPrerelease = $tag -match '^(alpha|beta|v.*-(alpha|beta|rc))'

        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "is-prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

        echo "## Release Information" >> $env:GITHUB_STEP_SUMMARY
        echo "- Tag: $tag" >> $env:GITHUB_STEP_SUMMARY
        echo "- Version: $version" >> $env:GITHUB_STEP_SUMMARY
        echo "- Pre-release: $isPrerelease" >> $env:GITHUB_STEP_SUMMARY

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install Windows SDK 10.0.19041.0 with UWP components
      run: |
        # CsWinRT requires UAP Platform.xml which is part of Windows SDK UWP components
        # Download and install Windows SDK 10.0.19041.0 with UAP components
        $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2120843"
        $installerPath = "$env:TEMP\winsdksetup.exe"

        Write-Host "Downloading Windows SDK 10.0.19041.0..."
        Invoke-WebRequest -Uri $sdkUrl -OutFile $installerPath -UseBasicParsing

        Write-Host "Installing Windows SDK with UWP components..."
        # Install SDK features needed for CsWinRT (Desktop C++ ARM64 includes UAP)
        Start-Process -FilePath $installerPath -ArgumentList "/features OptionId.UWPCpp /q /norestart" -Wait -NoNewWindow

        # Verify installation
        $platformXml = "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP\10.0.19041.0\Platform.xml"
        if (Test-Path $platformXml) {
          Write-Host "✅ Windows SDK UAP components installed successfully"
        } else {
          Write-Host "⚠️ Platform.xml not found, listing available platforms..."
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Platforms\" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
        }
      shell: pwsh

    # [Issue #292] BaketaTranslationServer is no longer built here
    # It's replaced by BaketaUnifiedServer which is distributed via models-v3 release

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build Native DLL (BaketaCaptureNative)
      run: |
        Write-Host "🔨 Building BaketaCaptureNative.dll (C++/WinRT)..."
        msbuild BaketaCaptureNative\BaketaCaptureNative.vcxproj /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

        # Verify DLL was built
        $dllPath = "BaketaCaptureNative\bin\Release\BaketaCaptureNative.dll"
        if (Test-Path $dllPath) {
          Write-Host "✅ BaketaCaptureNative.dll built successfully"
          $size = [math]::Round((Get-Item $dllPath).Length / 1KB, 2)
          Write-Host "   Size: $size KB"
        } else {
          Write-Host "❌ BaketaCaptureNative.dll not found!"
          exit 1
        }
      shell: pwsh

    - name: Publish UI application
      run: |
        dotnet publish Baketa.UI/Baketa.UI.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:IS_DISTRIBUTION=true `
          --output ./publish/Baketa-${{ steps.version.outputs.version }} `
          --verbosity minimal

    - name: Copy Native DLL to publish directory
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $publishDir = "./publish/Baketa-$version"
        $dllSource = "BaketaCaptureNative\bin\Release\BaketaCaptureNative.dll"

        Write-Host "📦 Copying BaketaCaptureNative.dll to publish directory..."
        Copy-Item $dllSource $publishDir -Force

        if (Test-Path "$publishDir\BaketaCaptureNative.dll") {
          Write-Host "✅ Native DLL copied successfully"
        } else {
          Write-Host "❌ Failed to copy native DLL!"
          exit 1
        }
      shell: pwsh

    # [Issue #292] Translation Server is no longer copied here
    # BaketaUnifiedServer is auto-downloaded from models-v3 on first run

    - name: Optimize package size
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $publishDir = "./publish/Baketa-$version"

        Write-Host "🔧 Optimizing package size..."

        # Remove unnecessary language folders (keep ja, en only)
        $unnecessaryLangs = @('cs', 'de', 'es', 'fr', 'it', 'ko', 'pl', 'pt-BR', 'ru', 'tr', 'zh-Hans', 'zh-Hant')
        $removedCount = 0
        $removedSize = 0
        foreach ($lang in $unnecessaryLangs) {
          $langPath = Join-Path $publishDir $lang
          if (Test-Path $langPath) {
            $folderSize = (Get-ChildItem -LiteralPath $langPath -Recurse -File | Measure-Object -Property Length -Sum).Sum
            $removedSize += $folderSize
            Remove-Item -LiteralPath $langPath -Recurse -Force
            $removedCount++
          }
        }
        Write-Host "  Removed $removedCount language folders ($([math]::Round($removedSize/1MB, 2)) MB freed)"

        # Remove dev config files
        $devConfigFiles = @('appsettings.Development.json', 'appsettings.AlphaTest.json', 'appsettings.Local.json')
        foreach ($file in $devConfigFiles) {
          $filePath = Join-Path $publishDir $file
          if (Test-Path $filePath) {
            Remove-Item -LiteralPath $filePath -Force
            Write-Host "  Removed: $file"
          }
        }

        # Remove PDB files
        $pdbFiles = Get-ChildItem -Path $publishDir -Filter "*.pdb" -Recurse
        $pdbCount = 0
        $pdbSize = 0
        foreach ($pdb in $pdbFiles) {
          $pdbSize += $pdb.Length
          Remove-Item -LiteralPath $pdb.FullName -Force
          $pdbCount++
        }
        if ($pdbCount -gt 0) {
          Write-Host "  Removed: $pdbCount PDB files ($([math]::Round($pdbSize/1MB, 2)) MB freed)"
        }

        # Remove XML doc files (except config files)
        $xmlDocFiles = Get-ChildItem -Path $publishDir -Filter "*.xml" -Recurse | Where-Object { $_.Name -notmatch 'appsettings|config' }
        $xmlCount = 0
        $xmlSize = 0
        foreach ($xml in $xmlDocFiles) {
          $xmlSize += $xml.Length
          Remove-Item -LiteralPath $xml.FullName -Force
          $xmlCount++
        }
        if ($xmlCount -gt 0) {
          Write-Host "  Removed: $xmlCount XML doc files ($([math]::Round($xmlSize/1MB, 2)) MB freed)"
        }

        # Display final size
        $finalSize = (Get-ChildItem $publishDir -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB
        Write-Host "✅ Optimization complete. Final size: $([math]::Round($finalSize, 2)) MB"
      shell: pwsh

    - name: Create .NET package
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $publishDir = "./publish/Baketa-$version"
        # [Issue #384] バージョン付きZIPはappcast生成用、Baketa.zipはリリースアセット用
        $versionedZipName = "Baketa-$version.zip"
        $stableZipName = "Baketa.zip"

        # Copy additional files (Issue #268: Use user-friendly README for release package)
        Copy-Item "docs/release/README.md" "$publishDir/" -ErrorAction SilentlyContinue
        Copy-Item "docs/release/README.ja.md" "$publishDir/" -ErrorAction SilentlyContinue
        Copy-Item "LICENSE" "$publishDir/" -ErrorAction SilentlyContinue

        # Create versioned zip (for appcast version extraction)
        Compress-Archive -Path "$publishDir/*" -DestinationPath "./publish/$versionedZipName" -Force
        # Create stable-named zip (for release asset)
        Copy-Item "./publish/$versionedZipName" "./publish/$stableZipName" -Force

        $size = [math]::Round((Get-Item "./publish/$stableZipName").Length / 1MB, 2)
        echo "## .NET Package" >> $env:GITHUB_STEP_SUMMARY
        echo "- Package: $stableZipName ($version)" >> $env:GITHUB_STEP_SUMMARY
        echo "- Size: $size MB" >> $env:GITHUB_STEP_SUMMARY

    # [Issue #249] Generate AppCast for auto-update
    - name: Install NetSparkle AppCast Generator
      run: |
        Write-Host "📦 Installing NetSparkle AppCast Generator..."
        dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator
        Write-Host "✅ AppCast Generator installed"
      shell: pwsh

    - name: Generate AppCast with Ed25519 signature
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_ED25519_PRIVATE_KEY }}
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $zipFile = "./publish/Baketa-$version.zip"
        $downloadUrl = "https://github.com/koizumiiiii/Baketa/releases/download/v$version"

        # Ed25519 公開鍵（UpdateService.csと同じ値）
        $publicKey = "mhVnvb6OPFeEaId0GsB+p1CGrQBsbNlJRDhb5RryHd0="

        Write-Host "🔐 Generating AppCast with Ed25519 signature..."

        # Check if private key is set
        if ([string]::IsNullOrWhiteSpace($env:SPARKLE_PRIVATE_KEY)) {
          Write-Host "⚠️ NETSPARKLE_ED25519_PRIVATE_KEY secret not set - skipping AppCast generation"
          Write-Host "   To enable auto-update, add the secret to repository settings"
          exit 0
        }

        # Debug: Show key length (not the actual key for security)
        $keyLength = $env:SPARKLE_PRIVATE_KEY.Length
        Write-Host "✅ Private key found (length: $keyLength characters)"

        # Create a dedicated directory for AppCast generation (zip only)
        $appcastDir = "./appcast-build"
        New-Item -ItemType Directory -Path $appcastDir -Force | Out-Null
        Copy-Item $zipFile $appcastDir -Force

        # Generate appcast.json with Ed25519 signature
        # Use both --private-key-override and --public-key-override
        netsparkle-generate-appcast `
          --binaries $appcastDir `
          --appcast-output-directory ./publish `
          --base-url $downloadUrl `
          --output-type json `
          --os windows `
          --ext zip `
          --file-extract-version `
          --private-key-override $env:SPARKLE_PRIVATE_KEY `
          --public-key-override $publicKey

        # Verify generation and signature
        if (Test-Path "./publish/appcast.json") {
          Write-Host "✅ appcast.json generated successfully"

          # [Issue #384] appcast.json内のURLファイル名をBaketa.zipに置換
          # appcastのbase-urlはバージョン固有パス維持、ファイル名のみ固定化
          $content = Get-Content "./publish/appcast.json" -Raw
          $content = $content -replace "Baketa-$version\.zip", "Baketa.zip"
          Set-Content "./publish/appcast.json" -Value $content -Encoding utf8
          Write-Host "🔗 [Issue #384] appcast.json URL updated: Baketa-$version.zip → Baketa.zip"
          Write-Host $content

          # Verify signature is present
          if ($content -match '"signature"') {
            Write-Host "✅ Ed25519 signature verified in appcast.json"
            echo "## AppCast" >> $env:GITHUB_STEP_SUMMARY
            echo "- appcast.json generated with Ed25519 signature ✅" >> $env:GITHUB_STEP_SUMMARY
            echo "- Download URL: .../v$version/Baketa.zip (stable filename)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host "❌ ERROR: No signature found in appcast.json!"
            Write-Host "   Check that NETSPARKLE_ED25519_PRIVATE_KEY secret is correctly set"
            exit 1
          }
        } else {
          Write-Host "❌ Failed to generate appcast.json"
          exit 1
        }
      shell: pwsh

    - name: Generate release notes
      run: |
        $version = "${{ steps.version.outputs.version }}"

        @"
        ## Baketa $version

        ### 開発終了のお知らせ / End of development

        Baketa の開発は終了しました。今後のアップデート・保守・サポートは行いません。

        有料プラン（Patreon）、アカウントログイン、Baketa 提供の Cloud AI 翻訳は終了しました。

        ローカル翻訳（NLLB）は引き続き無料で利用できます。自分の API キーで Gemini / Google Cloud Translation も利用できます（API 提供元の利用料金が発生する場合があります）。設定画面の「翻訳方式」で選択し、API キーを設定してください。

        このバージョンでは、旧版のログイン情報と既知のライセンス情報をこの PC から削除する移行処理を行います。削除に失敗した場合は次回起動時に再試行します。サーバー上のデータ削除を意味するものではありません。

        データ削除のお問い合わせ: privacy@baketa.app

        Development of Baketa has ended. There will be no further updates, maintenance, or support.

        Paid plans (Patreon), account login, and Baketa-provided Cloud AI translation have ended.

        Local translation (NLLB) remains free. You can also use Gemini / Google Cloud Translation with your own API key (provider charges may apply). Choose a translation method and enter your API key in Settings.

        This version runs a migration to remove old login credentials and known license data from this PC. Failed deletions are retried on the next launch. This does not mean that server-side data has been deleted.

        Data deletion inquiries: privacy@baketa.app

        ### Downloads

        | File | Description |
        |------|-------------|
        | ``Baketa.zip`` | Main application (Windows x64, self-contained) |
        | ``appcast.json`` | Auto-update manifest (for existing installations) |

        **Fixed download URL (always latest):** ``https://github.com/koizumiiiii/Baketa/releases/latest/download/Baketa.zip``

        ### Installation

        1. Download ``Baketa.zip``
        2. Extract to desired location
        3. Run ``Baketa.exe``
        4. On first run, required components will be downloaded automatically from [Model Assets v3](https://github.com/koizumiiiii/Baketa/releases/tag/models-v3)

        ### Updating from an older version

        Older installations can use their update notification to install this final release.
        This final release does not check for application updates automatically or manually.
        The signed appcast remains available for older clients migrating to this version.

        ### Auto-Downloaded Components (from models-v3)

        The following components are downloaded automatically on first run:
        - **BaketaUnifiedServer.zip** (~300MB CPU / ~2.7GB CUDA) - Unified AI Server (OCR + Translation)
        - **nllb-200-onnx-int8.zip** (~1.8GB) - Translation model (ONNX INT8)

        ### System Requirements

        - Windows 10/11 (x64)
        - Internet connection for initial component/OCR model downloads and BYOK cloud translation; local translation works offline after setup
        - Disk space for application, components, and OCR models (requirements vary by CPU/CUDA package)
        "@ | Out-File -FilePath "release_notes.md" -Encoding utf8

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: "Baketa ${{ steps.version.outputs.version }}"
        body_path: release_notes.md
        files: |
          ./publish/Baketa.zip
          ./publish/appcast.json
        prerelease: ${{ steps.version.outputs.is-prerelease == 'true' }}
        make_latest: ${{ steps.version.outputs.is-prerelease == 'false' }}
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
